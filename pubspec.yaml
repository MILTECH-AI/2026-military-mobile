name: military_maintenance
description: Galaxy Tab local maintenance management app.
publish_to: none
version: 0.3.0+3
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  drift: ^2.30.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  camera: ^0.12.0
  flutter_svg: ^2.2.0
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/mock/
    - assets/models/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
